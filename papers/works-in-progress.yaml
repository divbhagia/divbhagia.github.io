- id: monopsony_ineq
  title: Labor Market Concentration and Wealth Inequality
  coauthors: ["Thomas J. May"]
  coauthorLinks: ["https://mayecon.com/"]
  abstract: "In this paper, we develop a rich quantitative model to study the interaction between labor market concentration and wealth inequality. In our model, concentration affects wealth inequality through three channels. First, large firms pay lower wages while generating profits that go to wealthier shareholders. Second, borrowing-constrained workers cannot afford unemployment, which weakens their bargaining power and lowers their wages---an effect that is stronger in more concentrated markets where unemployment risk is higher. Third, there is lower job mobility in concentrated markets, leaving low-asset workers stuck in low-wage jobs. We utilize microdata and calibrate the model to match trends in U.S. labor markets to quantify the role of increasing concentration in rising wealth inequality over the last three decades. Finally, using our model as a laboratory, we study the optimal mix of minimum wage (a tax borne by employers) and social welfare (a tax on society as a whole). Our framework is well suited for this analysis, as it highlights how a worker’s ability to insure against risk influences the impact of employer market power."

- id: firm_learn
  title: "Firm Organization and Spillovers"
  coauthors: ["Esther Lee"]
  abstract: "This paper studies whether the organizational decisions of new entrants in a market are influenced by the hierarchical structure of their incumbent peers.  Using matched employer-employee data from Brazil, we classify establishments into one to four-layer entities and examine how a new entrant’s decision to add an organizational layer varies with the average number of layers of other establishments in their industry and location. To address the potential endogeneity of peers’ layers, we construct an instrument based on layers of other establishments in peers’ firms that operate in different markets. We find that new entrants are twice as likely to add a layer within five years if their average peer has one more layer at the time of entry. Our results suggest that organizational structure spillovers can provide a new source of agglomeration advantages. We also find that the influence of peers is stronger in industries that are more similar. Additionally, we show that new entrants with high-layer peers hire more workers from within the market in the newly created layers, indicating personnel exchanges as a mechanism for organizational spillovers."
