- id: monopsony_ineq
  title: Labor Market Concentration and Wealth Inequality
  coauthors: ["Thomas J. May"]
  coauthorLinks: ["https://mayecon.com/"]
  abstract: "In this paper, we develop a rich quantitative model to study the interaction between labor market concentration and wealth inequality. In our model, concentration affects wealth inequality through three channels. First, large firms pay lower wages while generating profits that go to wealthier shareholders. Second, borrowing-constrained workers cannot afford unemployment, which weakens their bargaining power and lowers their wages---an effect that is stronger in more concentrated markets where unemployment risk is higher. Third, there is lower job mobility in concentrated markets, leaving low-asset workers stuck in low-wage jobs. We utilize microdata and calibrate the model to match trends in U.S. labor markets to quantify the role of increasing concentration in rising wealth inequality over the last three decades. Finally, using our model as a laboratory, we study the optimal mix of minimum wage (a tax borne by employers) and social welfare (a tax on society as a whole). Our framework is well suited for this analysis, as it highlights how a worker’s ability to insure against risk influences the impact of employer market power."
